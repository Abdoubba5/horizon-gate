<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<!-- Dynamic SEO — updated by JS after data loads -->
	<title>تفاصيل الفرصة | بوابة الأفق</title>
	<meta name="description" content="اكتشف أفضل الفرص الدولية — منح دراسية، تدريبات، ومسابقات عبر بوابة الأفق"/>
	<meta name="robots" content="index, follow"/>
	<!-- Open Graph -->
	<meta property="og:type"        content="article"/>
	<meta property="og:site_name"   content="بوابة الأفق | Horizon Gate"/>
	<meta property="og:locale"      content="ar_DZ"/>
	<meta property="og:title"       content="تفاصيل الفرصة | بوابة الأفق"/>
	<meta property="og:description" content="اكتشف أفضل الفرص الدولية على بوابة الأفق"/>
	<meta property="og:image"       content=""/>
	<!-- Twitter -->
	<meta name="twitter:card"        content="summary_large_image"/>
	<meta name="twitter:title"       content="تفاصيل الفرصة | بوابة الأفق"/>
	<meta name="twitter:description" content="اكتشف أفضل الفرص الدولية على بوابة الأفق"/>
	<meta name="twitter:image"       content=""/>

	<link rel="canonical" href=""/>

	<link rel="stylesheet" href="css/style.css"/>
<style>
  /* ── Detail page ── */
  .detail-nav {
    position:sticky;top:0;z-index:50;
    background:rgba(5,5,8,0.9);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--card-border);
    padding:13px 28px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  [data-theme="light"] .detail-nav { background:rgba(245,245,247,0.92); }

  .detail-nav-logo {
    display:flex;align-items:center;gap:9px;
    font-family:'Cairo',sans-serif;font-size:1rem;font-weight:800;
    color:var(--gold);text-decoration:none;
  }
  .detail-nav-logo-icon {
    width:32px;height:32px;background:linear-gradient(135deg,#fbbf24,#f59e0b);
    border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;
  }
  .detail-nav-actions { display:flex;gap:8px;align-items:center; }

  /* Hero Banner */
  .detail-hero {
    position:relative;overflow:hidden;
    min-height:260px;display:flex;align-items:flex-end;
    padding:32px 28px 28px;
  }
  .detail-hero-bg {
    position:absolute;inset:0;z-index:0;
    background:linear-gradient(135deg,var(--bg-surface),var(--bg-main));
  }
  .detail-hero-img {
    position:absolute;inset:0;z-index:1;
    object-fit:cover;width:100%;height:100%;opacity:0.18;
    transition:opacity 0.4s;
  }
  .detail-hero-overlay {
    position:absolute;inset:0;z-index:2;
    background:linear-gradient(to top,rgba(5,5,8,0.96) 0%,rgba(5,5,8,0.3) 100%);
  }
  [data-theme="light"] .detail-hero-overlay {
    background:linear-gradient(to top,rgba(245,245,247,0.97) 0%,rgba(245,245,247,0.4) 100%);
  }
  .detail-hero-content { position:relative;z-index:3;width:100%;max-width:820px;margin:0 auto; }

  .detail-breadcrumb {
    font-size:0.75rem;color:var(--text-muted);font-family:'Cairo',sans-serif;
    display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;
  }
  .detail-breadcrumb a { color:var(--text-muted);text-decoration:none; }
  .detail-breadcrumb a:hover { color:var(--gold); }

  .detail-badges { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px; }
  .detail-type-badge {
    font-family:'Cairo',sans-serif;font-size:0.75rem;font-weight:700;
    padding:4px 12px;border-radius:999px;color:#000;
  }
  .detail-title {
    font-family:'Cairo',sans-serif;
    font-size:clamp(1.4rem,4vw,2rem);font-weight:900;
    color:var(--text-main);line-height:1.25;margin-bottom:14px;
  }
  .detail-meta-row {
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    font-size:0.82rem;color:var(--text-muted);
  }
  .detail-meta-item { display:flex;align-items:center;gap:5px; }

  /* Main layout */
  .detail-layout {
    max-width:1000px;margin:0 auto;padding:32px 24px 60px;
    display:grid;grid-template-columns:1fr 300px;gap:28px;
  }
  @media(max-width:768px){ .detail-layout{grid-template-columns:1fr;} }

  /* Left — content */
  .detail-body { display:flex;flex-direction:column;gap:24px; }

  .detail-section {
    background:var(--glass-bg);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);padding:24px;
  }
  .detail-section-title {
    font-family:'Cairo',sans-serif;font-size:0.9rem;font-weight:800;
    color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px;
    padding-bottom:10px;border-bottom:1px solid var(--card-border);
  }
  .detail-desc-text {
    font-size:0.9rem;color:var(--text-muted);line-height:2;white-space:pre-line;
  }

  /* Countdown big */
  .countdown-big {
    text-align:center;padding:24px;
    background:var(--glass-bg);border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
  }
  .countdown-big .cd-num {
    font-family:'Cairo',sans-serif;
    font-size:3rem;font-weight:900;line-height:1;
    display:block;margin-bottom:4px;
  }
  .countdown-big .cd-label {
    font-size:0.78rem;color:var(--text-muted);font-family:'Cairo',sans-serif;
  }
  .countdown-big.cd-urgent .cd-num { color:#f87171;animation:cdBig 1.2s infinite; }
  .countdown-big.cd-soon   .cd-num { color:var(--gold); }
  .countdown-big.cd-active .cd-num { color:#34d399; }
  .countdown-big.cd-expired .cd-num { color:var(--text-subtle); }
  @keyframes cdBig { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* Sidebar */
  .detail-sidebar { display:flex;flex-direction:column;gap:18px; }

  .sidebar-card {
    background:var(--glass-bg);border:1px solid var(--card-border);
    border-radius:var(--radius-lg);padding:20px;
  }
  .sidebar-card-title {
    font-family:'Cairo',sans-serif;font-size:0.8rem;font-weight:700;
    color:var(--text-muted);margin-bottom:14px;text-transform:uppercase;
    letter-spacing:0.06em;
  }

  /* Apply big btn */
  .btn-apply-big {
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
    color:#000;font-family:'Cairo',sans-serif;font-weight:800;font-size:1rem;
    padding:15px 20px;border-radius:12px;border:none;cursor:pointer;
    width:100%;text-decoration:none;
    box-shadow:0 0 24px rgba(251,191,36,0.25);
    transition:all 0.3s ease;
  }
  .btn-apply-big:hover { transform:translateY(-2px);box-shadow:0 0 40px rgba(251,191,36,0.4); }
  .btn-apply-big.disabled {
    background:rgba(75,85,99,0.2);color:var(--text-subtle);
    box-shadow:none;cursor:not-allowed;
  }

  /* Share buttons */
  .share-row { display:flex;flex-direction:column;gap:9px; }
  .btn-share {
    display:flex;align-items:center;gap:9px;
    padding:10px 14px;border-radius:10px;border:1px solid var(--card-border);
    background:rgba(255,255,255,0.03);color:var(--text-muted);
    font-size:0.82rem;font-family:'Cairo',sans-serif;font-weight:600;
    cursor:pointer;transition:all 0.2s;text-align:right;
  }
  .btn-share.wa  { color:#25d366; } .btn-share.wa:hover  { border-color:rgba(37,211,102,0.4);background:rgba(37,211,102,0.07); }
  .btn-share.tg  { color:#229ed9; } .btn-share.tg:hover  { border-color:rgba(34,158,217,0.4);background:rgba(34,158,217,0.07); }
  .btn-share.cp  { color:var(--accent-blue); } .btn-share.cp:hover { border-color:rgba(59,130,246,0.4);background:rgba(59,130,246,0.07); }

  /* Save + remind row */
  .action-row { display:flex;gap:9px; }
  .btn-action {
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:12px 8px;border-radius:10px;border:1px solid var(--card-border);
    background:rgba(255,255,255,0.03);color:var(--text-muted);
    font-size:0.72rem;font-family:'Cairo',sans-serif;font-weight:600;
    cursor:pointer;transition:all 0.25s;
  }
  .btn-action .btn-action-icon { font-size:1.2rem; }
  .btn-action:hover { background:rgba(255,255,255,0.06); }
  .btn-action.saved     { border-color:rgba(251,191,36,0.4);color:var(--gold);background:var(--gold-dim); }
  .btn-action.reminded  { border-color:rgba(239,68,68,0.4);color:#f87171;background:rgba(239,68,68,0.08); }

  /* Detail info list */
  .info-list { display:flex;flex-direction:column;gap:10px; }
  .info-row {
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    font-size:0.82rem;padding-bottom:10px;border-bottom:1px solid var(--card-border);
  }
  .info-row:last-child { border-bottom:none;padding-bottom:0; }
  .info-label { color:var(--text-muted);font-family:'Cairo',sans-serif;flex-shrink:0; }
  .info-value { color:var(--text-main);font-family:'Cairo',sans-serif;font-weight:600;text-align:left; }

  /* Not found */
  .not-found {
    max-width:500px;margin:80px auto;text-align:center;padding:0 24px;
  }
  .not-found .nf-icon { font-size:4rem;display:block;margin-bottom:20px;opacity:0.3; }
  .not-found h2 { font-family:'Cairo',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:10px; }
  .not-found p  { font-size:0.85rem;color:var(--text-muted);margin-bottom:24px; }

  /* ── Applicants Counter ── */
  .applicants-bar {
    display:flex;align-items:center;gap:10px;
    background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.18);
    border-radius:12px;padding:14px 18px;
  }
  .applicants-icon { font-size:1.4rem; }
  .applicants-num  {
    font-family:'Cairo',sans-serif;font-size:1.6rem;font-weight:900;
    color:#60a5fa;line-height:1;
  }
  .applicants-label { font-size:0.78rem;color:var(--text-muted);font-family:'Cairo',sans-serif; }

  .btn-applied {
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:0.95rem;
    padding:13px 20px;border-radius:12px;border:none;cursor:pointer;
    width:100%;transition:all 0.3s;margin-top:10px;
    box-shadow:0 0 20px rgba(59,130,246,0.25);
  }
  .btn-applied:hover { transform:translateY(-2px);box-shadow:0 0 32px rgba(59,130,246,0.4); }
  .btn-applied.done {
    background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);
    color:#34d399;box-shadow:none;cursor:default;
  }
  .btn-applied.done:hover { transform:none; }

  /* ── Reviews Section ── */
  .reviews-summary {
    display:flex;align-items:center;gap:16px;
    padding-bottom:18px;border-bottom:1px solid var(--card-border);margin-bottom:18px;
  }
  .avg-num {
    font-family:'Cairo',sans-serif;font-size:2.8rem;font-weight:900;
    color:var(--gold);line-height:1;
  }
  .avg-stars { font-size:1.1rem;letter-spacing:2px;color:#fbbf24; }
  .avg-count { font-size:0.78rem;color:var(--text-muted);font-family:'Cairo',sans-serif;margin-top:3px; }

  .rating-bars { flex:1; }
  .rbar-row {
    display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:0.72rem;
    color:var(--text-muted);font-family:'Cairo',sans-serif;
  }
  .rbar-label { width:14px;text-align:center; }
  .rbar-track { flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden; }
  .rbar-fill  { height:100%;background:#fbbf24;border-radius:999px;transition:width 0.5s ease; }
  .rbar-cnt   { width:20px;text-align:left; }

  /* Stars input */
  .star-input-row {
    display:flex;flex-direction:row-reverse;justify-content:flex-end;
    gap:4px;margin-bottom:12px;
  }
  .star-inp {
    font-size:1.6rem;cursor:pointer;color:rgba(255,255,255,0.15);
    background:none;border:none;padding:2px;transition:color 0.15s;line-height:1;
  }
  .star-inp:hover,.star-inp:hover ~ .star-inp,.star-inp.sel { color:#fbbf24; }

  /* Review card */
  .review-card {
    background:rgba(255,255,255,0.02);border:1px solid var(--card-border);
    border-radius:12px;padding:14px 16px;margin-bottom:10px;
    animation:cardIn 0.3s ease both;
  }
  .review-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:8px; }
  .review-stars  { color:#fbbf24;font-size:0.85rem;letter-spacing:1px; }
  .review-date   { font-size:0.72rem;color:var(--text-subtle);font-family:'Cairo',sans-serif; }
  .review-text   { font-size:0.83rem;color:var(--text-muted);line-height:1.7;font-family:'Tajawal',sans-serif; }
  .review-del    {
    background:none;border:none;color:rgba(239,68,68,0.4);cursor:pointer;
    font-size:0.75rem;padding:2px 6px;border-radius:6px;transition:all 0.2s;
    font-family:'Cairo',sans-serif;
  }
  .review-del:hover { background:rgba(239,68,68,0.1);color:#f87171; }

  /* Notif banner */
  .notif-banner {
    display:flex;align-items:center;gap:10px;
    background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.22);
    border-radius:12px;padding:12px 16px;font-size:0.8rem;
    color:#c084fc;font-family:'Cairo',sans-serif;cursor:pointer;
    transition:all 0.2s;
  }
  .notif-banner:hover { background:rgba(168,85,247,0.14); }
  .notif-banner.granted {
    background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.22);color:#34d399;cursor:default;
  }
</style>
  </head>
  <body>
	<div class="bg-mesh"></div>
	<div id="toast-container"></div>

	<!-- NAV -->
	<nav class="detail-nav">
	  <a href="index.html" class="detail-nav-logo">
		<div class="detail-nav-logo-icon">🌅</div>
		بوابة الأفق
	  </a>
	  <div class="detail-nav-actions">
		<a href="opportunities.html" class="nav-link" style="font-size:0.82rem;padding:7px 14px;">← العودة للفرص</a>
		<button class="theme-toggle" id="themeToggle" title="تبديل الوضع">🌙</button>
		<a href="saved.html" style="position:relative;display:inline-flex;">
		  <button class="btn btn-secondary" style="font-size:0.78rem;padding:7px 13px;">🔖 المحفوظات</button>
		  <span class="reminder-badge" style="top:-5px;left:-5px;"></span>
		</a>
	  </div>
	</nav>

	<!-- CONTENT rendered by JS -->
	<div id="pageContent"></div>

	<script src="js/horizon-db.js"></script>
	<script src="js/app-advanced.js"></script>
<script>
// Init theme
const _theme = HorizonApp.initTheme();
document.getElementById('themeToggle').textContent = _theme === 'dark' ? '☀️' : '🌙';
document.getElementById('themeToggle').onclick = () => {
  const t = HorizonApp.toggleTheme();
  document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙';
};
HorizonApp.updateReminderBadge();

// Get ID from URL
function getIdFromUrl() {
  const p = new URLSearchParams(location.search);
  return p.get('id') || '';
}

async function renderDetail() {
  const id   = getIdFromUrl();
  const item = id ? await HorizonDB.getById(id) : null;
  const page = document.getElementById('pageContent');

  if (!item) {
    page.innerHTML = `
    <div class="not-found">
      <span class="nf-icon">🔍</span>
      <h2>الفرصة غير موجودة</h2>
      <p>ربما تم حذف هذه الفرصة أو أن الرابط غير صحيح.</p>
      <a href="opportunities.html" class="btn btn-primary">← عرض جميع الفرص</a>
    </div>`;
    return;
  }

  const safe    = s => HorizonApp.sanitize(s||'');
  const expired = HorizonApp.isExpired(item.deadline);
  const cdClass = HorizonApp.getCountdownClass(item.deadline);
  const days    = HorizonApp.daysUntil(item.deadline);
  const cc      = HorizonApp.getCategoryColor(item.type);
  const isSaved = HorizonDB.isSaved(item.id);
  const isRem   = HorizonDB.isReminded(item.id);

  // Funding class
  let fClass='hzn-fund-none';
  if(item.funding==='ممولة بالكامل') fClass='hzn-fund-full';
  else if(item.funding==='ممولة جزئياً') fClass='hzn-fund-partial';

  // Countdown display
  let cdDisplay = '';
  if (expired) cdDisplay = `<span style="color:var(--text-subtle);">منتهية</span>`;
  else if (days === 0) cdDisplay = 'آخر يوم!';
  else if (days === 1) cdDisplay = '١';
  else cdDisplay = days;

  page.innerHTML = `
  <!-- HERO -->
  <div class="detail-hero">
    <div class="detail-hero-bg"></div>
    ${item.image ? `<img class="detail-hero-img" src="${safe(item.image)}" alt="" onerror="this.style.display='none'"/>` : ''}
    <div class="detail-hero-overlay"></div>
    <div class="detail-hero-content">
      <div class="detail-breadcrumb">
        <a href="index.html">الرئيسية</a> ›
        <a href="opportunities.html">الفرص</a> ›
        <span>${safe(item.type)}</span>
      </div>
      <div class="detail-badges">
        <span class="detail-type-badge" style="background:${cc};">${safe(item.type)}</span>
        <span class="hzn-fund-pill ${fClass}" style="font-size:0.73rem;padding:4px 12px;border-radius:999px;">${safe(item.funding)}</span>
      </div>
      <h1 class="detail-title">${safe(item.title)}</h1>
      <div class="detail-meta-row">
        <span class="detail-meta-item">🌍 ${safe(item.country)}</span>
        <span class="detail-meta-item">📅 ${HorizonApp.formatDate(item.deadline)}</span>
        <span class="detail-meta-item">🗓️ أُضيفت ${HorizonApp.formatDate(item.createdAt)}</span>
      </div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="detail-layout">

    <!-- LEFT -->
    <div class="detail-body">
      <div class="detail-section">
        <div class="detail-section-title">📋 وصف الفرصة</div>
        <div class="detail-desc-text">${safe(item.desc)}</div>
      </div>

      <div class="detail-section">
        <div class="detail-section-title">ℹ️ معلومات أساسية</div>
        <div class="info-list">
          <div class="info-row">
            <span class="info-label">نوع الفرصة</span>
            <span class="info-value" style="color:${cc};">${safe(item.type)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">التمويل</span>
            <span class="info-value">${safe(item.funding)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">دولة الاستضافة</span>
            <span class="info-value">${safe(item.country)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">آخر موعد للتقديم</span>
            <span class="info-value" style="color:${expired?'var(--text-subtle)':days<=7?'#f87171':'#34d399'};">
              ${HorizonApp.formatDate(item.deadline)}
            </span>
          </div>
        </div>
      </div>

      ${Array.isArray(item.tags) && item.tags.length ? `
      <div class="detail-section">
        <div class="detail-section-title">🏷️ الوسوم</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${item.tags.map(t => `
            <a href="opportunities.html?tag=${encodeURIComponent(t)}"
               style="display:inline-flex;align-items:center;gap:4px;
                      background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.22);
                      border-radius:999px;padding:5px 14px;font-size:0.78rem;
                      color:#fbbf24;font-family:'Cairo',sans-serif;font-weight:600;
                      text-decoration:none;transition:all 0.2s;pointer-events:auto;">
              #${safe(t)}
            </a>`).join('')}
        </div>
      </div>` : ''}

      <!-- REVIEWS SECTION -->
      <div class="detail-section" id="reviewsSection">
        <div class="detail-section-title">⭐ التقييمات والتعليقات</div>

        <!-- Summary -->
        <div class="reviews-summary" id="reviewsSummary">
          <div style="text-align:center;">
            <div class="avg-num" id="avgNum">—</div>
            <div class="avg-stars" id="avgStars">☆☆☆☆☆</div>
            <div class="avg-count" id="avgCount">لا يوجد تقييم بعد</div>
          </div>
          <div class="rating-bars" id="ratingBars"></div>
        </div>

        <!-- Add Review Form -->
        <div style="margin-bottom:20px;">
          <div style="font-size:0.82rem;font-family:'Cairo',sans-serif;color:var(--text-muted);margin-bottom:10px;">أضف تقييمك:</div>
          <div class="star-input-row" id="starInputRow">
            <button class="star-inp" data-val="1">★</button>
            <button class="star-inp" data-val="2">★</button>
            <button class="star-inp" data-val="3">★</button>
            <button class="star-inp" data-val="4">★</button>
            <button class="star-inp" data-val="5">★</button>
          </div>
          <textarea id="reviewComment"
            style="width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);
                   border-radius:10px;padding:11px 14px;color:var(--text-main);font-size:0.85rem;
                   outline:none;resize:vertical;min-height:80px;font-family:'Tajawal',sans-serif;
                   transition:all 0.2s;margin-bottom:10px;"
            placeholder="شاركنا رأيك في هذه الفرصة..."></textarea>
          <button class="btn btn-primary" style="width:100%;padding:11px;" onclick="submitReview()">
            إرسال التقييم ✦
          </button>
        </div>

        <!-- Reviews List -->
        <div id="reviewsList"></div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="detail-sidebar">

      <!-- Countdown -->
      <div class="countdown-big cd-${cdClass}">
        <span class="cd-num">${expired ? '🔒' : cdDisplay}</span>
        <span class="cd-label">${expired ? 'انتهى موعد التقديم' : days===0 ? 'آخر يوم للتقديم!' : 'يوم متبقي للتقديم'}</span>
      </div>

      <!-- Apply + Applied counter -->
      <div class="sidebar-card" style="padding:16px;">
        ${!expired
          ? `<a href="${safe(item.url)}" target="_blank" rel="noopener noreferrer"
               class="btn-apply-big" onclick="handleApply()">
               🚀 تقدم للفرصة الآن
             </a>`
          : `<div class="btn-apply-big disabled">🔒 انتهى موعد التقديم</div>`
        }
        <button class="btn-applied ${HorizonDB.hasApplied(item.id)?'done':''}"
                id="appliedBtn" onclick="handleApplied()">
          ${HorizonDB.hasApplied(item.id) ? '✓ تقدمت لهذه الفرصة' : '✋ سجّل أنك تقدمت'}
        </button>
        <div class="applicants-bar" style="margin-top:10px;">
          <span class="applicants-icon">👥</span>
          <div>
            <div class="applicants-num" id="applicantsNum">${item.applicants || 0}</div>
            <div class="applicants-label">تقدموا لهذه الفرصة</div>
          </div>
        </div>
      </div>

      <!-- Notification Banner -->
      <div id="notifBanner" class="notif-banner" onclick="requestNotifPermission()">
        🔔 <span id="notifText">فعّل الإشعارات لتذكيرك قبل انتهاء الموعد</span>
      </div>

      <!-- Save + Remind -->
      <div class="sidebar-card" style="padding:16px;">
        <div class="action-row">
          <button class="btn-action ${isSaved?'saved':''}" id="saveBtn" onclick="handleSave()">
            <span class="btn-action-icon">${isSaved?'🔖':'🔖'}</span>
            <span id="saveBtnLabel">${isSaved?'محفوظة':'احفظ'}</span>
          </button>
          <button class="btn-action ${isRem?'reminded':''}" id="remBtn" onclick="handleRemind()">
            <span class="btn-action-icon">🔔</span>
            <span id="remBtnLabel">${isRem?'مُذكِّر':'ذكّرني'}</span>
          </button>
        </div>
      </div>

      <!-- Share -->
      <div class="sidebar-card">
        <div class="sidebar-card-title">مشاركة الفرصة</div>
        <div class="share-row">
          <button class="btn-share wa" onclick="HorizonApp.shareWhatsApp(window._item)">
            <span>📱</span> مشاركة عبر واتساب
          </button>
          <button class="btn-share tg" onclick="HorizonApp.shareTelegram(window._item)">
            <span>✈️</span> مشاركة عبر تيليغرام
          </button>
          <button class="btn-share cp" onclick="handleCopy()">
            <span>🔗</span> <span id="copyLabel">نسخ الرابط</span>
          </button>
        </div>
      </div>

    </div>
  </div>`;

  // Store item globally for share functions
  window._item = item;

  // Update SEO meta tags dynamically
  updateSEO(item);
}

// ── Dynamic SEO Meta Tags ─────────────────────────────────────
function updateSEO(item) {
  if (!item) return;
  const safe  = s => HorizonApp.sanitize(s||'');
  const desc  = `${safe(item.type)} في ${safe(item.country)} — ${safe(item.funding)}. آخر موعد للتقديم: ${HorizonApp.formatDate(item.deadline)}. ${safe(item.desc).slice(0,120)}`;
  const title = `${safe(item.title)} | بوابة الأفق`;
  const img   = item.image || '';
  const canon = `${location.origin}${location.pathname}?id=${item.id}`;

  // Page title
  document.title = title;

  // Helper to set/create meta
  const setMeta = (attr, val, content) => {
    let el = document.querySelector(`meta[${attr}="${val}"]`);
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, val); document.head.appendChild(el); }
    el.setAttribute('content', content);
  };

  setMeta('name',     'description',        desc);
  setMeta('name',     'keywords',           [item.type, item.country, item.funding, ...(item.tags||[])].join(', '));
  setMeta('property', 'og:title',           title);
  setMeta('property', 'og:description',     desc);
  setMeta('property', 'og:url',             canon);
  setMeta('property', 'og:image',           img);
  setMeta('name',     'twitter:title',      title);
  setMeta('name',     'twitter:description',desc);
  setMeta('name',     'twitter:image',      img);

  // Canonical
  let canonEl = document.querySelector('link[rel="canonical"]');
  if (!canonEl) { canonEl = document.createElement('link'); canonEl.rel='canonical'; document.head.appendChild(canonEl); }
  canonEl.href = canon;

  // JSON-LD Structured Data (Schema.org)
  let ldEl = document.getElementById('ld-json');
  if (!ldEl) { ldEl = document.createElement('script'); ldEl.id='ld-json'; ldEl.type='application/ld+json'; document.head.appendChild(ldEl); }
  ldEl.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type":    "Event",
    "name":     item.title,
    "description": item.desc,
    "url":      item.url,
    "location": { "@type": "Place", "name": item.country },
    "endDate":  item.deadline,
    "organizer":{ "@type": "Organization", "name": "بوابة الأفق" },
    "offers":   { "@type": "Offer", "price": "0", "priceCurrency": "DZD",
                  "availability": HorizonApp.isExpired(item.deadline)
                    ? "https://schema.org/SoldOut"
                    : "https://schema.org/InStock" }
  });
}

// ── Actions ──────────────────────────────────────────────────
function handleSave() {
  const id      = getIdFromUrl();
  const nowSaved= HorizonDB.toggleSaved(id);
  document.getElementById('saveBtn').classList.toggle('saved', nowSaved);
  document.getElementById('saveBtnLabel').textContent = nowSaved ? 'محفوظة' : 'احفظ';
  showToast(nowSaved ? '🔖 تمت الإضافة للمحفوظات' : '✕ تمت الإزالة من المحفوظات', nowSaved?'success':'info');
}

function handleRemind() {
  const id    = getIdFromUrl();
  const nowR  = HorizonDB.toggleReminder(id);
  document.getElementById('remBtn').classList.toggle('reminded', nowR);
  document.getElementById('remBtnLabel').textContent = nowR ? 'مُذكِّر' : 'ذكّرني';
  HorizonApp.updateReminderBadge();
  showToast(nowR ? '🔔 أُضيف للتذكيرات' : '🔕 أُزيل من التذكيرات', nowR?'success':'info');
}

function handleCopy() {
  const item = window._item;
  if (!item) return;
  navigator.clipboard?.writeText(item.url).then(() => {
    document.getElementById('copyLabel').textContent = '✓ تم النسخ!';
    setTimeout(() => document.getElementById('copyLabel').textContent = 'نسخ الرابط', 2000);
  });
}

// ── Applied / Applicants ─────────────────────────────────────
function handleApply() {
  // فقط يفتح الرابط — التسجيل يتم بزر منفصل
}

async function handleApplied() {
  const id  = getIdFromUrl();
  const btn = document.getElementById('appliedBtn');
  if (HorizonDB.hasApplied(id)) return; // سبق التسجيل

  const registered = await HorizonDB.registerApply(id);
  if (registered) {
    btn.textContent = '✓ تقدمت لهذه الفرصة';
    btn.classList.add('done');
    // تحديث العداد في الواجهة
    const newCount = parseInt(document.getElementById('applicantsNum').textContent || '0') + 1;
    document.getElementById('applicantsNum').textContent = newCount;
    showToast('✦ تم تسجيل تقدمك بنجاح', 'success');
  }
}

// ── Browser Notifications ────────────────────────────────────
function initNotifBanner() {
  const banner = document.getElementById('notifBanner');
  if (!banner) return;
  if (!('Notification' in window)) { banner.style.display='none'; return; }
  if (Notification.permission === 'granted') {
    banner.className = 'notif-banner granted';
    document.getElementById('notifText').textContent = '✓ الإشعارات مفعّلة';
    banner.onclick = null;
  } else if (Notification.permission === 'denied') {
    banner.style.display = 'none';
  }
}

async function requestNotifPermission() {
  if (!('Notification' in window)) return;
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    document.getElementById('notifBanner').className = 'notif-banner granted';
    document.getElementById('notifText').textContent = '✓ الإشعارات مفعّلة';
    document.getElementById('notifBanner').onclick = null;
    scheduleReminders();
    showToast('🔔 سيصلك تنبيه قبل 3 أيام و يوم من الموعد', 'success');
  } else {
    showToast('⚠️ لم يتم السماح بالإشعارات', 'warning');
  }
}

function scheduleReminders() {
  // نتحقق من التذكيرات المحلية ونرسل إشعار للفرص القريبة
  const ids = HorizonDB.getReminderIds();
  if (!ids.length || !window._item) return;
  const item = window._item;
  if (!ids.includes(item.id)) return;

  const days = HorizonApp.daysUntil(item.deadline);
  if (days === 3 || days === 1 || days === 0) {
    const label = days === 0 ? 'آخر يوم!' : `باقي ${days} ${days===1?'يوم':'أيام'}`;
    new Notification(`⏰ ${item.title}`, {
      body: `${label} على انتهاء موعد التقديم`,
      icon: './icons/icon-192.png',
      tag:  `reminder-${item.id}`,
    });
  }
}

// ── Reviews ───────────────────────────────────────────────────
let _selectedRating = 0;

function initStars() {
  const stars = document.querySelectorAll('.star-inp');
  if (!stars.length) return;
  stars.forEach(star => {
    star.addEventListener('click', () => {
      _selectedRating = parseInt(star.dataset.val);
      stars.forEach(s => {
        s.classList.toggle('sel', parseInt(s.dataset.val) <= _selectedRating);
      });
    });
  });
}

async function loadReviews() {
  const id = getIdFromUrl();
  try {
    const reviews = await HorizonDB.getReviews(id);
    renderReviewsList(reviews);
    renderReviewsSummary(reviews);
  } catch (e) {
    console.warn('loadReviews:', e.message);
  }
}

function renderReviewsSummary(reviews) {
  if (!reviews.length) return;
  const sum = reviews.reduce((a,r)=>a+r.rating,0);
  const avg = Math.round((sum/reviews.length)*10)/10;
  const count = reviews.length;

  document.getElementById('avgNum').textContent  = avg.toFixed(1);
  document.getElementById('avgStars').textContent = '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg));
  document.getElementById('avgCount').textContent = `${count} تقييم`;

  // Rating bars
  const bars = document.getElementById('ratingBars');
  bars.innerHTML = [5,4,3,2,1].map(n => {
    const cnt = reviews.filter(r=>r.rating===n).length;
    const pct = count ? Math.round((cnt/count)*100) : 0;
    return `<div class="rbar-row">
      <span class="rbar-label">${n}</span>
      <div class="rbar-track"><div class="rbar-fill" style="width:${pct}%"></div></div>
      <span class="rbar-cnt">${cnt}</span>
    </div>`;
  }).join('');
}

function renderReviewsList(reviews) {
  const list = document.getElementById('reviewsList');
  if (!list) return;
  if (!reviews.length) {
    list.innerHTML = `<div style="text-align:center;padding:20px;font-size:0.82rem;color:var(--text-subtle);font-family:'Cairo',sans-serif;">
      لا توجد تعليقات بعد — كن أول من يقيّم هذه الفرصة!
    </div>`;
    return;
  }
  list.innerHTML = reviews.map(r => `
    <div class="review-card">
      <div class="review-header">
        <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="review-date">${HorizonApp.formatDate(r.created_at)}</span>
          ${sessionStorage.getItem('admin_authenticated')==='true'
            ? `<button class="review-del" onclick="deleteReview('${r.id}')">حذف</button>`
            : ''}
        </div>
      </div>
      <div class="review-text">${HorizonApp.sanitize(r.comment)}</div>
    </div>`).join('');
}

async function submitReview() {
  if (!_selectedRating) { showToast('⚠️ اختر عدد النجوم أولاً', 'warning'); return; }
  const comment = document.getElementById('reviewComment')?.value.trim();
  if (!comment) { showToast('⚠️ اكتب تعليقاً', 'warning'); return; }
  if (comment.length < 5) { showToast('⚠️ التعليق قصير جداً', 'warning'); return; }

  try {
    await HorizonDB.addReview(getIdFromUrl(), _selectedRating, comment);
    document.getElementById('reviewComment').value = '';
    _selectedRating = 0;
    document.querySelectorAll('.star-inp').forEach(s=>s.classList.remove('sel'));
    await loadReviews();
    showToast('✦ تم إرسال تقييمك، شكراً!', 'success');
  } catch (e) {
    showToast('✕ فشل الإرسال: ' + e.message, 'error');
  }
}

async function deleteReview(reviewId) {
  try {
    await HorizonDB.deleteReview(reviewId);
    await loadReviews();
    showToast('✓ تم حذف التعليق', 'info');
  } catch (e) {
    showToast('✕ فشل الحذف', 'error');
  }
}

function showToast(message, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className=`toast ${type}`; t.textContent=message; c.appendChild(t);
  setTimeout(()=>{ t.style.animation='toastOut 0.3s ease forwards'; setTimeout(()=>t.remove(),300); },3000);
}

// Boot
async function boot() {
  await renderDetail();
  initStars();
  await loadReviews();
  initNotifBanner();
  scheduleReminders();
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
</script>
